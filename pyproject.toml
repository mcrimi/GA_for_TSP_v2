[project]
name = "tsp-ga"
version = "2.0.0"
description = "A genetic algorithm for the travelling salesman problem, read through plant breeding"
readme = "README.md"
license = "MIT"
authors = [{ name = "Mariano Crimi" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "numba>=0.61"]

[project.scripts]
tsp-ga = "tsp_ga.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]
report = ["matplotlib>=3.9", "jupyter>=1.1", "pandas>=2.2", "tabulate>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tsp_ga"]

[tool.ruff]
line-length = 100
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
